<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Emulador GBA</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui,sans-serif}
  #menu{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:20px;text-align:center}
  h1{font-size:22px;margin:0}
  p{margin:0;color:#aaa;font-size:14px;max-width:420px}
  button,label.btn{background:#e53935;color:#fff;border:0;border-radius:10px;padding:14px 22px;font-size:16px;cursor:pointer}
  button.sec,label.btn.sec{background:#333}
  input[type=file]{display:none}
  #game{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;display:none;background:#000;overflow:hidden}
  #ejs .ejs_menu_bar{display:none!important}
  body.showmenu #ejs .ejs_menu_bar{display:flex!important;opacity:1!important;visibility:visible!important;transform:none!important;bottom:0!important;top:auto!important;pointer-events:auto!important;z-index:9998!important}
  #menubtn{position:fixed;top:8px;right:8px;z-index:2147483647;width:40px;height:40px;padding:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:20px;display:none;touch-action:manipulation}
  #ejs{position:absolute;top:0;left:0;width:100%;height:100%;display:block!important}
  #ejs .ejs_parent{width:100%!important;height:100%!important}
  #msg{font-size:13px;color:#ffb74d;min-height:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div id="menu">
  <h1>Emulador GBA</h1>
  <p id="info">Carga tu ROM una vez: queda guardada en este navegador, igual que tu progreso.</p>
  <div class="row">
    <button id="play" style="display:none">▶ Continuar con la ROM guardada</button>
    <label class="btn sec">Elegir ROM (.gba)<input id="file" type="file" accept=".gba,.GBA"></label>
  </div>
  <div class="row">
    <button class="sec" id="forget" style="display:none">Olvidar ROM</button>
  </div>
  <div id="msg"></div>
</div>
<div id="game"><div id="ejs"></div></div>
<button id="menubtn" title="Menú">☰</button>
<pre id="dbg" style="position:fixed;left:0;right:0;bottom:0;max-height:35vh;overflow:auto;margin:0;padding:6px;background:rgba(0,0,0,.75);color:#8f8;font-size:11px;z-index:99999;display:none;pointer-events:none;white-space:pre-wrap"></pre>

<script>
const DB='gba-rom-store', STORE='roms', KEY='current';
const $=id=>document.getElementById(id);
const H=location.hash.replace('#','');const DEBUG=H.includes('debug');
const dbg=t=>{if(!DEBUG)return;const d=$('dbg');d.style.display='block';d.textContent+=t+'\n';d.scrollTop=1e9;};
window.addEventListener('error',e=>dbg('ERR: '+e.message));
window.addEventListener('unhandledrejection',e=>dbg('REJ: '+(e.reason&&e.reason.message||e.reason)));
['error','warn'].forEach(k=>{const o=console[k];console[k]=(...a)=>{try{dbg(k+': '+a.map(x=>String(x&&x.message||x)).join(' ').slice(0,300));}catch(_){}o.apply(console,a);};});
const VER=(H.replace('debug','').replace(/[^a-z0-9.]/g,'')||'stable');
const say=t=>$('msg').textContent=t||'';

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function put(v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,KEY);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function get(){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(STORE).objectStore(STORE).get(KEY);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
async function del(){const d=await idb();return new Promise((res)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).delete(KEY);t.oncomplete=res;});}

let saved=null;
async function refresh(){
  try{saved=await get();}catch(e){saved=null;}
  $('play').style.display=saved?'':'none';
  $('forget').style.display=saved?'':'none';
  if(saved)$('info').textContent='ROM guardada: '+saved.name+'. Tu partida se guarda automáticamente.';
}

function start(blob,name){
  $('menu').style.display='none';$('menubtn').style.display='block';
  const g=$('game');g.style.display='block';
  const url=URL.createObjectURL(blob);
  window.EJS_player='#ejs';
  window.EJS_core='gba';
  window.EJS_gameName=(name||'rom').replace(/\.[^.]+$/,'');
  window.EJS_gameUrl=url;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/'+VER+'/data/';
  dbg('Version emulador: '+VER+' | WebGL2: '+!!document.createElement('canvas').getContext('webgl2'));
  window.EJS_startOnLoaded=true;
  window.EJS_color='#e53935';
  window.EJS_defaultOptions={'save-state-location':'browser','save-save-interval':'30'};
  window.EJS_threads=false;
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/'+VER+'/data/loader.js';
  s.onerror=()=>{g.style.display='none';$('menu').style.display='flex';say('No se pudo cargar el emulador (CDN bloqueado). Prueba abriendo esta página fuera de la app o con otra red.');};
  document.body.appendChild(s);
  window.EJS_ready=()=>dbg('EJS_ready');
  window.EJS_onGameStart=()=>dbg('EJS_onGameStart');
  [3,8].forEach(t=>setTimeout(()=>{
    const e=$('ejs');const r=e.getBoundingClientRect();const gr=g.getBoundingClientRect();const ec=getComputedStyle(e);dbg('t+'+t+'s #game '+Math.round(gr.width)+'x'+Math.round(gr.height)+' disp:'+getComputedStyle(g).display+' | #ejs disp:'+ec.display+' vis:'+ec.visibility+' pos:'+ec.position+' inDOM:'+document.contains(e));
    const cs=[...document.querySelectorAll('canvas')].map(c=>{const b=c.getBoundingClientRect();return c.width+'x'+c.height+' vis '+Math.round(b.width)+'x'+Math.round(b.height)+' disp:'+getComputedStyle(c).display+' op:'+getComputedStyle(c).opacity});
    dbg('t+'+t+'s game '+Math.round(r.width)+'x'+Math.round(r.height)+' hijos:'+g.children.length+' canvas:'+(cs.join(' | ')||'ninguno')+' EJS:'+(typeof window.EJS_emulator)+' '+(window.EJS_emulator&&window.EJS_emulator.started));
  },t*1000));
}

$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  say('Guardando ROM…');
  try{await put({name:f.name,blob:f});}catch(err){say('No se pudo guardar la ROM (se usará solo esta sesión).');}
  start(f,f.name);
};
let _t=0;
const toggleMenu=e=>{if(e){e.preventDefault();e.stopPropagation();}const n=Date.now();if(n-_t<400)return;_t=n;
  const on=document.body.classList.toggle('showmenu');dbg('menu '+(on?'abrir':'cerrar'));
  document.querySelectorAll('#ejs .ejs_menu_bar').forEach(m=>m.classList.remove('ejs_menu_bar_hidden'));
  try{const m=window.EJS_emulator&&window.EJS_emulator.menu;if(m)(on?m.open:m.close)&&(on?m.open():m.close());}catch(err){dbg('menu api: '+err.message);}};
$('menubtn').addEventListener('click',toggleMenu);
$('menubtn').addEventListener('touchend',toggleMenu,{passive:false});
$('play').onclick=()=>start(saved.blob,saved.name);
$('forget').onclick=async()=>{await del();saved=null;$('info').textContent='ROM olvidada. Elige una nueva.';$('play').style.display='none';$('forget').style.display='none';};
refresh();
</script>
</body>
</html>
