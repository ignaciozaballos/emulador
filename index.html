<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Emulador GBA</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#eee;font-family:system-ui,sans-serif}
  #menu{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:20px;text-align:center}
  h1{font-size:22px;margin:0}
  p{margin:0;color:#aaa;font-size:14px;max-width:420px}
  button,label.btn{background:#e53935;color:#fff;border:0;border-radius:10px;padding:14px 22px;font-size:16px;cursor:pointer}
  button.sec,label.btn.sec{background:#333}
  input[type=file]{display:none}
  #game{width:100%;height:100%;display:none}
  #msg{font-size:13px;color:#ffb74d;min-height:18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div id="menu">
  <h1>Emulador GBA</h1>
  <p id="info">Carga tu ROM una vez: queda guardada en este navegador, igual que tu progreso.</p>
  <div class="row">
    <button id="play" style="display:none">▶ Continuar con la ROM guardada</button>
    <label class="btn sec">Elegir ROM (.gba)<input id="file" type="file" accept=".gba,.GBA"></label>
  </div>
  <div class="row">
    <button class="sec" id="forget" style="display:none">Olvidar ROM</button>
  </div>
  <div id="msg"></div>
</div>
<div id="game"></div>

<script>
const DB='gba-rom-store', STORE='roms', KEY='current';
const $=id=>document.getElementById(id);
const say=t=>$('msg').textContent=t||'';

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function put(v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,KEY);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function get(){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(STORE).objectStore(STORE).get(KEY);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
async function del(){const d=await idb();return new Promise((res)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).delete(KEY);t.oncomplete=res;});}

let saved=null;
async function refresh(){
  try{saved=await get();}catch(e){saved=null;}
  $('play').style.display=saved?'':'none';
  $('forget').style.display=saved?'':'none';
  if(saved)$('info').textContent='ROM guardada: '+saved.name+'. Tu partida se guarda automáticamente.';
}

function start(blob,name){
  $('menu').style.display='none';
  const g=$('game');g.style.display='block';
  const url=URL.createObjectURL(blob);
  window.EJS_player='#game';
  window.EJS_core='gba';
  window.EJS_gameName=(name||'rom').replace(/\.[^.]+$/,'');
  window.EJS_gameUrl=url;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded=true;
  window.EJS_color='#e53935';
  window.EJS_defaultOptions={'save-state-location':'browser'};
  window.EJS_threads=false;
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  s.onerror=()=>{g.style.display='none';$('menu').style.display='flex';say('No se pudo cargar el emulador (CDN bloqueado). Prueba abriendo esta página fuera de la app o con otra red.');};
  document.body.appendChild(s);
}

$('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  say('Guardando ROM…');
  try{await put({name:f.name,blob:f});}catch(err){say('No se pudo guardar la ROM (se usará solo esta sesión).');}
  start(f,f.name);
};
$('play').onclick=()=>start(saved.blob,saved.name);
$('forget').onclick=async()=>{await del();saved=null;$('info').textContent='ROM olvidada. Elige una nueva.';$('play').style.display='none';$('forget').style.display='none';};
refresh();
</script>
</body>
</html>
